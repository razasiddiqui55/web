<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/web/"/>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="I am Hammad Siddiqui, a computer science student focused on developing a Flutter app.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS Meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hammad Portfolio">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="icon" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#212121">
  <title>Hammad Portfolio</title>

  <!-- Lottie & Typed.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.9.6/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #212121;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #956afa 0%, transparent 70%);
      filter: blur(120px);
      animation: pulse 6s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    .card {
      background-color: #212121;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
      transition: opacity 0.2s ease-out, transform 0.2s ease-out;
      position: relative;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .card.hide {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .lottie-container {
      width: 250px;
      height: 200px;
      margin-bottom: 20px;
    }

    .loader {
      color: rgb(200, 200, 200);
      font-size: 24px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .typed {
      color: #956afa;
      font-weight: 600;
    }

    .progress-bar {
      width: 80%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      margin-top: 20px;
      overflow: hidden;
      border-radius: 4px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #956afa;
      animation: load 3s linear forwards;
    }

    @keyframes load {
      to { width: 100%; }
    }

    #flutter-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in;
    }

    #flutter-container.show {
      opacity: 1;
    }

    @media screen and (max-width: 700px) {
      .loader {
        font-size: 18px;
        padding: 1rem;
      }
    }
  </style>
</head>

<body>
<div id="flutter-container"></div>

<div class="card">
  <div class="lottie-container" id="lottie-animation"></div>

  <div class="loader">
    <p>Loading&nbsp;<span id="typed-text" class="typed"></span></p>
  </div>

  <div class="progress-bar">
    <div class="progress"></div>
  </div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
    // Load Lottie animation
    lottie.loadAnimation({
      container: document.getElementById("lottie-animation"),
      renderer: "svg",
      loop: true,
      autoplay: true,
      path: "https://assets1.lottiefiles.com/packages/lf20_w51pcehl.json"
    });

    // Typing animation
    new Typed("#typed-text", {
      strings: ["Portfolio...", "Flutter App...", "Experience..."],
      typeSpeed: 60,
      backSpeed: 30,
      loop: true
    });

    // Show Flutter when ready
    window.addEventListener('flutter-first-frame', function () {
      const card = document.querySelector('.card');
      const flutterContainer = document.querySelector('#flutter-container');

      card.classList.add('hide');
      flutterContainer.classList.add('show');

      setTimeout(() => {
        card.style.display = 'none';
      }, 1000);
    });
  </script>
</body>
</html>
